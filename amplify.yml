version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 14
        - node --version
        - npm ci
    build:
      commands:
        - NODE_OPTIONS=--openssl-legacy-provider npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
